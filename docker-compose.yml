version: '3.5'
services:
  milvus:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.4.5  # Use a stable, recent version
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: "/var/lib/milvus/etcd"
      COMMON_STORAGETYPE: "local"
    volumes:
      # THE MAGIC LINE: This mounts your downloaded HuggingFace backup into the container!
      - ./data/vector_db/volumes-release/volumes/milvus:/var/lib/milvus
    ports:
      - "19530:19530" # The main API port your Python script will connect to
      - "9091:9091"   # The health check port
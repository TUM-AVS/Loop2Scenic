vector_db:
  collection_name: documents
  distance_metric: cosine # Options: cosine, l2, ip

  # Milvus mode
  use_lite: false # true: Milvus Lite (no Docker), false: Milvus Server (requires Docker)
  lite_db_path: ./data/vector_db/milvus.db # Path for Milvus Lite database file

  # Milvus Server settings (used when use_lite=false)
  host: localhost
  port: 19530
  index_type: IVF_FLAT # Options: IVF_FLAT, IVF_SQ8, HNSW
  nlist: 1024 # Number of cluster units (for IVF indexes)
  nprobe: 10 # Number of clusters to search

embedding:
  provider: qwen # Options: huggingface, openai, gemini, qwen
  model_name: Qwen3-VL-Embedding-2B
  model_path: ./models/Qwen3-VL-Embedding-2B
  # Examples:
  # - HuggingFace: sentence-transformers/all-MiniLM-L6-v2
  # - OpenAI: text-embedding-ada-002, text-embedding-3-large
  # - Gemini: models/embedding-001
  # - Qwen: Qwen3-VL-Embedding (offline, requires model_path)
  #   Example: model_path: ./models/Qwen3-VL-Embedding
  batch_size: 4
  device: cuda # For HuggingFace only (cpu, cuda, mps)

chunking:
  strategy: recursive # Options: recursive, fixed, semantic
  chunk_size: 1000
  chunk_overlap: 200
  separators: ["\n\n", "\n", ". ", " ", ""]

retrieval:
  top_k: 3
  similarity_threshold: 0.7
  enable_reranking: true
  rerank_top_k: 3

reranking:
  model_path: ./models/Qwen3-VL-Reranker-2B
  model_name: Qwen3-VL-Reranker-2B
  device: cuda
  torch_dtype: fp16

llm:
  provider: openai # Options: openai, anthropic, gemini
  model: gpt-3.5-turbo
  # Examples:
  # - OpenAI: gpt-3.5-turbo, gpt-4, gpt-4-turbo-preview
  # - Anthropic: claude-3-opus-20240229, claude-3-sonnet-20240229
  # - Gemini: gemini-pro, gemini-pro-vision
  temperature: 0.7
  max_tokens: 512

ingestion:
  supported_formats: [".txt", ".pdf", ".docx", ".md", ".html"]
  batch_size: 10
  max_workers: 4

logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: ./logs/rag_pipeline.log

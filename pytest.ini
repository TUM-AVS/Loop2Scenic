[pytest]
# Pytest configuration file

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Markers
markers =
    unit: Unit tests with all mocks
    integration: Integration tests with some real components
    e2e: End-to-end tests with all real components
    slow: Tests that take a long time to run
    expensive: Tests that cost money (API calls)

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    -ra

# Coverage (if pytest-cov is installed)
# [tool:pytest]
# addopts = --cov=src --cov-report=term-missing
